[package]
name = "craggemini-core"
version = "0.5.3"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
http = "1.5"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1.29", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
strip = false

[lib]
path = "lib.rs"

[[bin]]
name = "craggemini"
path = "main.rs"

[workspace]
